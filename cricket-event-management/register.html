<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRICKETARENA | Registration</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">CRICKETARENA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="teams.html">Teams</a></li>
            <li class="nav-item"><a class="nav-link active" href="register.html">Registration</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="page-header">
      <div class="container">
        <p class="eyebrow">Join the action</p>
        <h1>Team registration</h1>
        <p>Submit participant and team details for upcoming CRICKETARENA tournaments.</p>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container form-shell">
          <form class="registration-form" id="registrationForm" novalidate>
            <div class="row">
              <div class="col-md-6">
                <label class="form-label" for="teamName">Team Name</label>
                <input class="form-control" id="teamName" name="teamName" type="text" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="captainName">Captain Name</label>
                <input class="form-control" id="captainName" name="captainName" type="text" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone Number</label>
                <input class="form-control" id="phone" name="phone" type="tel" pattern="[0-9]{10}" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <label class="form-label" for="players">Number of Players</label>
                <input class="form-control" id="players" name="players" type="number" min="7" max="15" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="event">Select Event</label>
                <select class="form-select" id="event" name="event" required>
                  <option value="">Choose event</option>
                  <option>Inter-College T20 Cup</option>
                  <option>Summer League Championship</option>
                  <option>Friendly Weekend Series</option>
                </select>
              </div>
            </div>
            <label class="form-label" for="message">Additional Notes</label>
            <textarea class="form-control" id="message" name="message" rows="4" placeholder="Mention jersey color, preferred slot, or special requirements."></textarea>
            <div class="form-check">
              <input class="form-check-input" id="terms" name="terms" type="checkbox" required>
              <label class="form-check-label" for="terms">I confirm that the submitted details are correct.</label>
            </div>
            <button class="btn btn-primary" type="submit">Submit Registration</button>
            <p class="form-message" id="registrationMessage" role="status"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>&copy; 2026 CRICKETARENA. All rights reserved.</p>
        <p>Built by Team Git Side Smashers.</p>
      </div>
    </footer>

    <button class="back-to-top" type="button" aria-label="Back to top">↑</button>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
